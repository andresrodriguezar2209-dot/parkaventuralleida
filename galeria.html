<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0c0c"><title>Galería · Park Aventura Lleida</title><meta name="description" content="Fotos de las experiencias de Park Aventura Lleida: paintball, Laser Tag, realidad virtual y mucho más."><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#0c0c0c;--orange:#ff650d;--white:#f6f4ef;--muted:#aaa7a1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif}.wrap{width:min(1250px,calc(100% - 36px));margin:auto}.nav{height:75px;border-bottom:1px solid #ffffff20;display:flex;align-items:center;justify-content:space-between}.brand{font:900 1.3rem 'Barlow Condensed';text-decoration:none;color:white}.brand span{color:var(--orange)}a{color:inherit}.btn{display:inline-block;padding:12px 17px;background:var(--orange);color:#111;text-decoration:none;font-size:.78rem;font-weight:900;text-transform:uppercase}.intro{padding:75px 0 35px}.eyebrow{color:var(--orange);font-size:.72rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase}h1{font:900 clamp(3.5rem,10vw,7.5rem)/.88 'Barlow Condensed';text-transform:uppercase;margin:17px 0}h1 span{color:var(--orange)}.intro p{max-width:580px;color:var(--muted);line-height:1.8}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:30px 0}.filters button{background:transparent;border:1px solid #ffffff35;color:white;padding:10px 14px;cursor:pointer;font:800 .72rem 'DM Sans';text-transform:uppercase}.filters button.active,.filters button:hover{background:var(--orange);border-color:var(--orange);color:#111}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:clamp(140px,16vw,205px);grid-auto-flow:dense;gap:14px;padding-bottom:75px}.item:nth-child(8n+1){grid-column:span 2;grid-row:span 2}.item:nth-child(8n+5){grid-row:span 2}.item{position:relative;overflow:hidden;background:#191919;aspect-ratio:auto;min-height:180px;border:1px solid #ffffff20;border-radius:5px;box-shadow:0 12px 35px #0006;cursor:zoom-in;isolation:isolate}.item img{width:100%;height:100%;min-height:inherit;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.75,.2,1),filter .5s}.item:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0002,transparent 45%,#0005);opacity:.45;pointer-events:none;transition:opacity .35s}.item:hover img{transform:scale(1.075);filter:saturate(1.15)}.item:hover:after{opacity:.8}.item figcaption{display:none}.empty{color:var(--muted);padding:35px 0}.foot{border-top:1px solid #ffffff20;padding:25px 0;color:var(--muted);font-size:.8rem}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:clamp(150px,30vw,230px);gap:10px}.item:nth-child(8n+1){grid-column:span 2;grid-row:span 2}.item:nth-child(8n+5){grid-row:span 1}}@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:145px;gap:8px}.item:nth-child(8n+1){grid-column:span 2;grid-row:span 2}.item:nth-child(8n+5){grid-row:span 1}}

iv>
<script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from'./supabase-config.js';const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const root=document.getElementById('gallery');let photos=[];let current='all';document.getElementById('year').textContent=new Date().getFullYear();const lightbox=document.getElementById('lightbox');const lightboxImage=document.getElementById('lightboxImage');function closeLightbox(){lightbox.classList.remove('open');lightbox.setAttribute('aria-hidden','true');lightboxImage.removeAttribute('src');document.body.style.overflow='';}document.getElementById('lightboxClose').addEventListener('click',closeLightbox);lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLightbox()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()});function render(){root.replaceChildren();const visible=photos.filter(p=>current==='all'||p.category===current);if(!visible.length){const p=document.createElement('p');p.className='empty';p.textContent='Todavía no hay fotos publicadas en esta categoría. ¡Pronto habrá novedades!';root.append(p);return}for(const photo of visible){const figure=document.createElement('figure');figure.className='item';figure.tabIndex=0;figure.setAttribute('role','button');figure.setAttribute('aria-label','Ampliar fotografía');const img=document.createElement('img');img.loading='lazy';img.src=photo.url||db.storage.from('park-gallery').getPublicUrl(photo.storage_path).data.publicUrl;img.alt=photo.title||'Park Aventura Lleida';const open=()=>{lightboxImage.src=img.src;lightboxImage.alt=img.alt;lightbox.classList.add('open');lightbox.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'};figure.addEventListener('click',open);figure.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});figure.append(img);root.append(figure)}}document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.category;document.querySelectorAll('[data-category]').forEach(x=>x.classList.toggle('active',x===b));render()}));const{data,error}=await db.from('gallery_photos').select('id,title,category,storage_path').eq('is_published',true).order('sort_order').order('created_at',{ascending:false});if(error){photos=repositoryPhotos;render()}else{const repoImage=name=>'https://raw.githubusercontent.com/andresrodriguezar2209-dot/parkaventuralleida/main/'+encodeURIComponent(name);
const repositoryPhotos=[
{title:'Partida de Laser Tag',category:'laser-tag',url:repoImage('PHOTO-2026-11-07-14-41-48.jpg')},

{title:'Acción entre refugios',category:'paintball',url:repoImage('PHOTO-2026-11-07-14-44-31.jpg')},
{title:'Recuerdo de la partida',category:'paintball',url:repoImage('PHOTO-2026-11-07-14-44-31 (1).jpg')},
{title:'Zona de celebración y comida',category:'cumpleanos',url:repoImage('PHOTO-2026-11-07-14-45-28.jpg')}
];
photos=[...repositoryPhotos,...(data||[])];render()}</script></body></html>
