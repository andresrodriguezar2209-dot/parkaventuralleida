tem:hover img{transform:scale(1.075);filter:saturate(1.15)}.item:hover:after{opacity:.8}.item figcaption{display:none}.empty{color:var(--muted);padding:35px 0}.foot{border-top:1px solid #ffffff20;padding:25px 0;color:var(--muted);font-size:.8rem}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}}
.lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:22px;background:#000e;backdrop-filter:blur(12px)}.lightbox.open{display:flex}.lightbox img{display:block;max-width:min(1100px,100%);max-height:86vh;object-fit:contain;border:1px solid #ffffff35;box-shadow:0 25px 90px #000}.lightbox-close{position:absolute;top:18px;right:18px;width:44px;height:44px;border:1px solid #ffffff60;background:var(--orange);color:#111;font-size:1.8rem;cursor:pointer}.lightbox[aria-hidden="true"]{pointer-events:none}</style><style id="gallery-premium-2026">

.nav{gap:20px}.intro{padding:clamp(52px,7vw,100px) 0 30px;border-bottom:1px solid #ffffff16}.intro p{max-width:660px}
.filters{position:sticky;top:0;z-index:12;display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding:15px 0;margin:0 0 22px;background:#0c0c0cf5;backdrop-filter:blur(14px)}
.filters button{white-space:nowrap;flex:none;border-radius:6px;padding:12px 17px;transition:background .2s}

</style></head><body><div class="wrap"><nav class="nav"><a class="brand" href="/">PARK AVENTURA <span>LLEIDA</span></a><a class="btn" href="/">Volver a la web ↗</a></nav><header class="intro"><span class="eyebrow">Así se vive la aventura</span><h1>Momentos <span>reales.</span></h1><p>Descubre algunas de las experiencias que se viven en Park Aventura Lleida. Cada foto cuenta una misión, un reto y un buen recuerdo.</p></header><div id="filters" class="filters"><button class="active" data-category="all">Todas</button><button data-category="paintball">Paintball</button><button data-category="laser-tag">Laser Tag</button><button data-category="realidad-virtual">Realidad virtual</button><button data-category="humor-amarillo">Humor amarillo</button><button data-category="cumpleanos">Cumpleaños y grupos</button><button data-category="team-building">Team Building</button><button data-category="stress-room">Stress Room</button><button data-category="battle-start">Battle Start</button></div><main id="gallery" class="grid"><p class="empty">Cargando galería…</p></main><div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Fotografía ampliada"><button class="lightbox-close" id="lightboxClose" type="button" aria-label="Cerrar fotografía">×</button><button class="gallery-step gallery-prev" id="galleryPrev" aria-label="Foto anterior" type="button">‹</button><img id="lightboxImage" alt=""><button class="gallery-step gallery-next" id="galleryNext" aria-label="Foto siguiente" type="button">›</button><span class="gallery-counter" id="galleryCounter" aria-live="polite"></span></div><footer class="foot">© <span id="year"></span> Park Aventura Lleida · <a href="/">Volver al inicio</a></footer></div>
<script type="module">
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './supabase-config.js';
let db=null;
const root = document.getElementById('gallery');
let photos = [];
let current = 'all';
let visiblePhotos = [];
let activePhotoIndex = -1;
let lastPhotoTrigger=null;
document.getElementById('year').textContent = new Date().getFullYear();
const lightbox = document.getElementById('lightbox');
const lightboxImage = document.getElementById('lightboxImage');
function showPhoto(index){if(!visiblePhotos.length)return;activePhotoIndex=(index+visiblePhotos.length)%visiblePhotos.length;const p=visiblePhotos[activePhotoIndex];lightboxImage.src=p.url||db.storage.from('park-gallery').getPublicUrl(p.storage_path).data.publicUrl;lightboxImage.alt=p.title||'Fotografía de Park Aventura Lleida';document.getElementById('galleryCounter').textContent=(activePhotoIndex+1)+' / '+visiblePhotos.length;}
document.getElementById('galleryPrev').addEventListener('click',()=>showPhoto(activePhotoIndex-1));
document.getElementById('galleryNext').addEventListener('click',()=>showPhoto(activePhotoIndex+1));
function closeLightbox() {
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden', 'true');
  lightboxImage.removeAttribute('src');
  document.body.style.overflow = '';
  if(lastPhotoTrigger?.isConnected)lastPhotoTrigger.focus();
}
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox();if(lightbox.classList.contains('open')&&e.key==='ArrowLeft')showPhoto(activePhotoIndex-1);if(lightbox.classList.contains('open')&&e.key==='ArrowRight')showPhoto(activePhotoIndex+1); });
function render() {
  root.replaceChildren();
  const visible = photos.filter(p => current === 'all' || p.category === current);
  visiblePhotos = visible;
  if (!visible.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = 'Todavía no hay fotos publicadas en esta categoría. ¡Pronto habrá novedades!';
    root.append(p);
    return;
  }
  for (const [index,photo] of visible.entries()) {
    const figure = document.createElement('figure');
    figure.className = 'item';
    figure.tabIndex = 0;
    figure.setAttribute('role', 'button');
    figure.setAttribute('aria-label', 'Ampliar fotografía');
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = photo.url || db.storage.from('park-gallery').getPublicUrl(photo.storage_path).data.publicUrl;
    img.alt = photo.title || 'Park Aventura Lleida';
    const open = () => {
      lastPhotoTrigger=figure;
      showPhoto(index);
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.getElementById('lightboxClose').focus();
      document.body.style.overflow = 'hidden';
    };
    figure.addEventListener('click', open);
    figure.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });
    figure.append(img);
    root.append(figure);
  }
}
document.querySelectorAll('[data-category]').forEach(b => b.addEventListener('click', () => {
  current = b.dataset.category;
  document.querySelectorAll('[data-category]').forEach(x => (x.classList.toggle('active', x === b),x.setAttribute('aria-pressed',String(x===b))));
  render();
}));
const repoImage = name => '/' + encodeURIComponent(name);
const repositoryPhotos = [
  { title: 'Mesa de pica-pica para Team Building', category: 'team-building', url: '/assets/team-building-pica-pica-1.jpg' },
  { title: 'Aperitivos y sala para grupos', category: 'team-building', url: '/assets/team-building-pica-pica-2.jpg' },
  { title: 'Partida de Laser Tag', category: 'laser-tag', url: repoImage('PHOTO-2026-11-07-14-41-48.jpg') },
  { title: 'Realidad virtual en grupo', category: 'realidad-virtual', url: repoImage('PHOTO-2026-11-07-14-41-48 (1).jpg') },
  { title: 'Simulador de conducción', category: 'realidad-virtual', url: repoImage('PHOTO-2026-11-07-14-41-48 (2).jpg') },
  { title: 'Experiencia inmersiva VR', category: 'realidad-virtual', url: repoImage('PHOTO-2026-11-07-14-41-48 (3).jpg') },
  { title: 'Jugador en el campo', category: 'paintball', url: repoImage('PHOTO-2026-11-07-14-41-49.jpg') },
  { title: 'Equipo preparado para jugar', category: 'paintball', url: repoImage('PHOTO-2026-11-07-14-41-49 (1).jpg') },
  { title: 'Acción en el campo', category: 'paintball', url: repoImage('PHOTO-2026-11-07-14-41-50.jpg') },
  { title: 'Foto de grupo', category: 'paintball', url: repoImage('PHOTO-2026-11-07-14-41-50 (1).jpg') },
  { title: 'Partida entre obstáculos', category: 'paintball', url: repoImage('PHOTO-2026-11-07-14-44-30.jpg') },
  { title: 'Estrategia en equipo', category: 'paintball', url: repoImage('PHOTO-2026-11-07-14-44-30 (1).jpg') },
  { title: 'Avance por el campo', category: 'paintball', url: repoImage('PHOTO-2026-11-07-14-44-30 (2).jpg') },
  { title: 'Grupo de paintball', category: 'paintball', url: repoImage('PHOTO-2026-11-07-14-44-30 (3).jpg') },
  { title: 'Acción entre refugios', category: 'paintball', url: repoImage('PHOTO-2026-11-07-14-44-31.jpg') },
  { title: 'Recuerdo de la partida', category: 'paintball', url: repoImage('PHOTO-2026-11-07-14-44-31 (1).jpg') },
  { title: 'Zona de celebración y comida', category: 'cumpleanos', url: repoImage('PHOTO-2026-11-07-14-45-28.jpg') }
];
photos=repositoryPhotos;
render();
document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b.classList.contains('active'))));
document.addEventListener('keydown',e=>{
 if(e.key!=='Tab'||!lightbox.classList.contains('open'))return;
 const buttons=[...lightbox.querySelectorAll('button')],first=buttons[0],last=buttons[buttons.length-1];
 if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
 else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});
async function loadPublishedPhotos(){
 try{
  const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');
  db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const {data,error}=await db.from('gallery_photos').select('id,title,category,storage_path').eq('is_published',true).order('sort_order').order('created_at',{ascending:false}).abortSignal(AbortSignal.timeout(8000));
  if(error||!data?.length)return;
  // Keep the current photo index stable while a visitor is using the lightbox.
  if(lightbox.classList.contains('open')||root.contains(document.activeElement))return;
  photos=[...repositoryPhotos,...data];render();
 }catch{/* Local photos and all controls remain available. */}
}
loadPublishedPhotos();
</script></body></html>
