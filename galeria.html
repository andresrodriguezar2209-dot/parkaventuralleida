<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0c0c"><title>Galería · Park Aventura Lleida</title><meta name="description" content="Fotos de las experiencias de Park Aventura Lleida: paintball, Laser Tag, realidad virtual y mucho más."><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#0c0c0c;--orange:#ff650d;--white:#f6f4ef;--muted:#aaa7a1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif}.wrap{width:min(1250px,calc(100% - 36px));margin:auto}.nav{height:75px;border-bottom:1px solid #ffffff20;display:flex;align-items:center;justify-content:space-between}.brand{font:900 1.3rem 'Barlow Condensed';text-decoration:none;color:white}.brand span{color:var(--orange)}a{color:inherit}.btn{display:inline-block;padding:12px 17px;background:var(--orange);color:#111;text-decoration:none;font-size:.78rem;font-weight:900;text-transform:uppercase}.intro{padding:75px 0 35px}.eyebrow{color:var(--orange);font-size:.72rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase}h1{font:900 clamp(3.5rem,10vw,7.5rem)/.88 'Barlow Condensed';text-transform:uppercase;margin:17px 0}h1 span{color:var(--orange)}.intro p{max-width:580px;color:var(--muted);line-height:1.8}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:30px 0}.filters button{background:transparent;border:1px solid #ffffff35;color:white;padding:10px 14px;cursor:pointer;font:800 .72rem 'DM Sans';text-transform:uppercase}.filters button.active,.filters button:hover{background:var(--orange);border-color:var(--orange);color:#111}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;padding-bottom:75px}.item{position:relative;overflow:hidden;background:#191919;aspect-ratio:4/3;border:1px solid #ffffff18}.item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.item:hover img{transform:scale(1.06)}.item figcaption{position:absolute;inset:auto 0 0;padding:25px 15px 13px;background:linear-gradient(transparent,#000c);font-weight:800}.empty{color:var(--muted);padding:35px 0}.foot{border-top:1px solid #ffffff20;padding:25px 0;color:var(--muted);font-size:.8rem}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.grid{grid-template-columns:1fr}.item{aspect-ratio:4/3}}
</style></head><body><div class="wrap"><nav class="nav"><a class="brand" href="/">PARK AVENTURA <span>LLEIDA</span></a><a class="btn" href="/">Volver a la web ↗</a></nav><header class="intro"><span class="eyebrow">Así se vive la aventura</span><h1>Momentos <span>reales.</span></h1><p>Descubre algunas de las experiencias que se viven en Park Aventura Lleida. Cada foto cuenta una misión, un reto y un buen recuerdo.</p></header><div id="filters" class="filters"><button class="active" data-category="all">Todas</button><button data-category="paintball">Paintball</button><button data-category="laser-tag">Laser Tag</button><button data-category="realidad-virtual">Realidad virtual</button><button data-category="humor-amarillo">Humor amarillo</button><button data-category="cumpleanos">Cumpleaños y grupos</button></div><main id="gallery" class="grid"><p class="empty">Cargando galería…</p></main><footer class="foot">© <span id="year"></span> Park Aventura Lleida · <a href="/">Volver al inicio</a></footer></div>
<script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from'./supabase-config.js';const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const root=document.getElementById('gallery');let photos=[];let current='all';document.getElementById('year').textContent=new Date().getFullYear();function render(){root.replaceChildren();const visible=photos.filter(p=>current==='all'||p.category===current);if(!visible.length){const p=document.createElement('p');p.className='empty';p.textContent='Todavía no hay fotos publicadas en esta categoría. ¡Pronto habrá novedades!';root.append(p);return}for(const photo of visible){const figure=document.createElement('figure');figure.className='item';const img=document.createElement('img');img.loading='lazy';img.src=db.storage.from('park-gallery').getPublicUrl(photo.storage_path).data.publicUrl;img.alt=photo.title||'Park Aventura Lleida';const cap=document.createElement('figcaption');cap.textContent=photo.title||photo.category.replaceAll('-',' ');figure.append(img,cap);root.append(figure)}}document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.category;document.querySelectorAll('[data-category]').forEach(x=>x.classList.toggle('active',x===b));render()}));const{data,error}=await db.from('gallery_photos').select('id,title,category,storage_path').eq('is_published',true).order('sort_order').order('created_at',{ascending:false});if(error){root.textContent='No se ha podido cargar la galería. Inténtalo de nuevo más tarde.'}else{photos=data;render()}</script></body></html>
